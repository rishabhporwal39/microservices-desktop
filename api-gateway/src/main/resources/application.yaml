spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: invoice-service
              uri: lb://INVOICE-SERVICE
              predicates:
                - Path=/invoice/**

server:
  port: 8085


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true